<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Battleship</h1>
    </header>
    <main>
      <div class="panel" id="start-panel">
        <button id="start-game">Start Game</button>
      </div>

      <div id="boards-panel" class="hidden">
        <div class="panel" id="game-message">
          Aquí irán los mensajes para guiar el juego
        </div>
        <div class="panels">
          <div class="panel">
            <h2>User Board</h2>

            <div id="player-board" class="board"></div>

            <button id="horizontal" class="secondary-button">Horizontal</button>
            <button id="vertical" class="secondary-button">Vertical</button>
          </div>

          <div class="panel">
            <h2>Computer Board</h2>
            <div id="enemy-board" class="board"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
